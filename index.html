<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>検品報告・生産性管理システム | PC専用ワークステーション</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    @media print {
      body { background: white !important; }
      header, nav, #camera-controls, .no-print { display: none !important; }
      #tab-productivity { display: block !important; }
      .print-card { break-inside: avoid; border: 1px solid #cbd5e1 !important; }
    }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="bg-slate-100/70 text-slate-800 antialiased min-h-screen flex flex-col font-sans selection:bg-indigo-100 selection:text-indigo-900">

  <header class="bg-white border-b border-slate-200/90 sticky top-0 z-30 shadow-xs backdrop-blur-md bg-white/95">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-700 to-indigo-500 flex items-center justify-center text-white font-black text-base shadow-sm tracking-tight">
          検
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base sm:text-lg font-black text-slate-900 tracking-tight leading-tight">
              検品報告・生産性管理システム
            </h1>
            <span class="hidden sm:inline-flex items-center gap-1 text-[11px] font-bold bg-indigo-50 text-indigo-700 border border-indigo-200 px-2 py-0.5 rounded-md">
              PC専用ステーション
            </span>
          </div>
          <p class="text-xs text-slate-500 font-medium flex items-center gap-2 mt-0.5">
            <span id="syncIndicator" class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="headerMasterCount">マスタ読込中...</span>
            <span>·</span>
            <span class="text-slate-700 font-bold">担当: <span id="headerWorkerName">山田</span></span>
            <span class="hidden sm:inline">·</span>
            <span id="headerGasStatus" class="hidden sm:inline text-slate-500 text-[11px]">GAS版</span>
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <div class="bg-slate-100 p-1 rounded-xl border border-slate-200/80 flex items-center gap-1">
          <button onclick="switchTab('workstation')" id="nav-workstation" class="px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-white text-indigo-700 shadow-xs border border-slate-200/80">
            <span>検品ステーション</span>
            <span id="badgeDraftCount" class="hidden bg-rose-500 text-white rounded-full text-[10px] font-black px-1.5 py-0.2">0</span>
          </button>
          <button onclick="switchTab('productivity')" id="nav-productivity" class="px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 text-slate-600 hover:text-slate-900">
            <span>生産性ダッシュボード</span>
          </button>
          <button onclick="switchTab('settings')" id="nav-settings" class="px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 text-slate-600 hover:text-slate-900">
            <span>設定・GAS連携</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <div id="toastNotification" class="hidden fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-bold py-2.5 px-5 rounded-full shadow-2xl flex items-center gap-2">
    <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
    <span id="toastMessage">完了しました</span>
  </div>

  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
    <section id="tab-workstation" class="block space-y-6">
      <div class="bg-white rounded-2xl p-4 border border-slate-200/90 shadow-xs flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-indigo-50 border border-indigo-100 flex items-center justify-center text-indigo-600 font-bold">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          </div>
          <div>
            <div class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">作業ステーション担当者</div>
            <div class="flex items-center gap-2 mt-0.5">
              <input type="text" id="workerInput" class="px-2.5 py-1 bg-slate-50 border border-slate-200 rounded-lg text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 w-32" value="山田">
              <div class="flex gap-1">
                <button onclick="setQuickWorker('山田')" class="px-2 py-1 bg-slate-100 hover:bg-indigo-50 text-slate-700 rounded text-xs font-semibold">山田</button>
                <button onclick="setQuickWorker('佐藤')" class="px-2 py-1 bg-slate-100 hover:bg-indigo-50 text-slate-700 rounded text-xs font-semibold">佐藤</button>
                <button onclick="setQuickWorker('鈴木')" class="px-2 py-1 bg-slate-100 hover:bg-indigo-50 text-slate-700 rounded text-xs font-semibold">鈴木</button>
              </div>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <span class="text-xs font-bold text-slate-600">入力カメラ:</span>
          <select id="cameraSelect" onchange="onCameraDeviceChange(this.value)" class="text-xs font-bold text-slate-800 bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 max-w-[260px] truncate">
            <option value="">カメラ検出中...</option>
          </select>
          <button id="btnToggleCamera" onclick="toggleCamera()" class="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold rounded-lg border border-indigo-200">
            <span id="cameraToggleText">カメラ停止</span>
          </button>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        <div class="lg:col-span-7 space-y-4">
          <div class="bg-slate-900 rounded-2xl overflow-hidden shadow-md border border-slate-800 relative">
            <div class="px-4 py-2 bg-slate-950/80 border-b border-slate-800 flex items-center justify-between text-xs text-slate-300">
              <span class="font-bold text-white">1. バーコードスキャン</span>
            </div>
            <div class="relative bg-black flex items-center justify-center min-h-[260px] max-h-[340px] overflow-hidden">
              <div id="pc-webcam-reader" class="w-full"></div>
            </div>
          </div>

          <!-- コックピット（スキャン後・手動選択後の数量入力エリア） -->
          <div id="scannedItemCockpit" class="bg-white rounded-2xl p-5 border-2 border-indigo-200 shadow-md transition-all">
            <div id="cockpitIdleState" class="py-6 text-center space-y-2">
              <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center mx-auto border border-indigo-100">
                <svg class="w-6 h-6 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/></svg>
              </div>
              <h3 class="text-sm font-extrabold text-slate-800">カメラにバーコードをかざすか、下の検索をご利用ください</h3>
              <p class="text-xs text-slate-500 max-w-sm mx-auto">
                選択完了後、数量を入力してリストに追加できます。
              </p>
            </div>
            <div id="cockpitActiveState" class="hidden space-y-4">
              <div class="bg-white border-2 border-indigo-300 p-4 rounded-xl shadow-xs space-y-2.5">
                <div class="flex items-start justify-between">
                  <div class="flex items-center gap-2">
                    <span class="inline-flex items-center gap-1 text-[11px] font-black bg-emerald-600 text-white px-2 py-0.5 rounded">選択完了</span>
                    <span id="activeItemCode" class="text-sm font-black text-indigo-900 font-mono">RMB-001</span>
                    <span class="text-xs font-mono text-slate-400">JAN: <span id="activeItemJan" class="font-mono">4580001230011</span></span>
                  </div>
                  <button onclick="cancelActiveScan()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">✕</button>
                </div>
                <h4 id="activeItemName1" class="text-base font-black text-slate-900">ROMBO</h4>
                <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 flex flex-wrap items-center justify-between gap-3">
                  <span class="text-xs font-black bg-amber-200 text-amber-900 px-2 py-0.5 rounded">仕様</span>
                  <span id="activeItemName2" class="text-base font-black text-amber-950">BLK WHT S</span>
                  <span class="text-xs font-black bg-slate-900 text-white px-2 py-0.5 rounded">サイズ</span>
                  <span id="activeItemSize" class="text-xl font-black text-indigo-900 bg-white px-3 py-0.5 rounded-lg border-2 border-indigo-300">M</span>
                </div>
              </div>

              <div class="bg-indigo-50/40 p-4 rounded-xl border border-indigo-100 space-y-3">
                <label class="text-xs font-black text-indigo-900 flex items-center gap-1.5">
                  2. テンキーで検品数量を入力 & 確定
                </label>
                <div class="flex items-center gap-3">
                  <button type="button" onclick="adjustTenkeyQty(-1)" class="w-12 h-12 rounded-xl bg-white text-slate-800 text-2xl font-bold border">-</button>
                  <input type="number" id="tenkeyQtyInput" min="1" max="9999" value="1" onkeydown="handleTenkeyKeyDown(event)" class="flex-1 text-center text-3xl font-black py-2.5 bg-white border-2 border-indigo-400 rounded-xl text-slate-900">
                  <button type="button" onclick="adjustTenkeyQty(1)" class="w-12 h-12 rounded-xl bg-white text-indigo-700 text-2xl font-bold border">+</button>
                </div>
                <div class="grid grid-cols-4 gap-2">
                  <button type="button" onclick="setTenkeyQty(1)" class="py-1 bg-white text-xs font-bold rounded border">1個</button>
                  <button type="button" onclick="setTenkeyQty(5)" class="py-1 bg-white text-xs font-bold rounded border">5個</button>
                  <button type="button" onclick="setTenkeyQty(10)" class="py-1 bg-white text-xs font-bold rounded border">10個</button>
                  <button type="button" onclick="setTenkeyQty(20)" class="py-1 bg-white text-xs font-bold rounded border">20個</button>
                </div>
              </div>

              <button type="button" onclick="confirmActiveItem()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-sm rounded-xl shadow-md transition">
                3. 検品確認リストに追加
              </button>
            </div>
          </div>

          <!-- 手動検索エリア -->
          <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-xs relative">
            <input type="text" id="searchInput" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold placeholder:text-slate-400 focus:outline-none focus:border-indigo-600" placeholder="手動検索（スペース区切りAND検索 / 品名・品番・カラー・サイズ）...">
            <div id="suggestBox" class="hidden absolute left-0 right-0 top-full mt-1.5 bg-white border border-slate-200 rounded-xl shadow-2xl z-40 max-h-[300px] overflow-y-auto divide-y divide-slate-100"></div>
          </div>
        </div>

        <div class="lg:col-span-5 space-y-4">
          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col h-[740px]">
            <div class="p-4 border-b border-slate-200 bg-slate-50 rounded-t-2xl flex items-center justify-between">
              <h3 class="text-sm font-extrabold text-slate-900">4. 検品確認リスト (<span id="listTotalKindsBadge">0品目</span>)</h3>
              <div id="listTotalQuantityBadge" class="text-xl font-black text-indigo-700">0 個</div>
            </div>

            <div id="draftListContainer" class="flex-1 overflow-y-auto p-4 space-y-2.5">
              <div id="draftListEmpty" class="h-full flex flex-col items-center justify-center text-center p-8 text-slate-400">
                <div class="text-xs font-bold text-slate-600">未送信の検品実績はありません</div>
              </div>
            </div>

            <div class="p-4 border-t border-slate-200 bg-slate-50 rounded-b-2xl space-y-3">
              <button type="button" id="btnOpenSubmitModal" onclick="openSubmitModal()" disabled class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-black text-sm rounded-xl">
                5. スプレッドシートへ送信 (作業時間入力)
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- TAB 2: 生産性ダッシュボード -->
    <section id="tab-productivity" class="hidden space-y-6">
      <div id="prodLockScreen" class="bg-white rounded-2xl p-8 border max-w-md mx-auto text-center shadow-lg space-y-4 my-12">
        <h3 class="text-base font-extrabold text-slate-900">管理者セキュリティロック</h3>
        <input type="password" id="prodPinInput" maxlength="8" placeholder="PINコード (初期: 0120)" onkeydown="if(event.key==='Enter') unlockProductivity()" class="w-full text-center tracking-widest text-lg font-mono font-bold py-2.5 bg-slate-50 border rounded-xl">
        <button onclick="unlockProductivity()" class="w-full py-2.5 bg-indigo-600 text-white font-bold rounded-xl">ロック解除</button>
      </div>
      <div id="prodDashboardContent" class="hidden space-y-6">
        <div class="bg-white rounded-2xl p-6 border shadow-xs">
          <h2 class="text-lg font-black text-slate-900">作業者別生産性ダッシュボード</h2>
        </div>
      </div>
    </section>

    <!-- TAB 3: 設定・GAS連携 -->
    <section id="tab-settings" class="hidden space-y-6">
      <div class="bg-white rounded-2xl p-6 border shadow-xs space-y-4">
        <h3 class="text-base font-black text-slate-900">GAS連携設定</h3>
        <input type="url" id="gasUrlInput" class="w-full px-3.5 py-2.5 bg-slate-50 border rounded-xl font-mono text-sm" placeholder="https://script.google.com/macros/s/.../exec">
        <button onclick="saveGasUrl()" class="px-4 py-2.5 bg-indigo-600 text-white font-bold text-xs rounded-xl">保存</button>
      </div>
    </section>
  </main>

  <!-- MODAL: SUBMIT -->
  <div id="modalSubmit" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4">
      <h3 class="text-lg font-black text-slate-900 text-center">本日の作業時間入力</h3>
      <div class="space-y-1.5">
        <label class="text-xs font-bold text-slate-700">記録する作業者名</label>
        <input type="text" id="modalWorkerInput" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm font-bold">
      </div>
      <div class="space-y-1.5">
        <label class="text-xs font-bold text-slate-700">検品日</label>
        <input type="date" id="modalInspectionDateInput" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-xs font-bold">
      </div>
      <div class="space-y-2">
        <label class="text-xs font-bold text-slate-700">本日の総作業時間（分単位 / 同日の既存時間は上書きされます）</label>
        <input type="number" id="workMinutesInput" min="0" max="1440" value="240" class="w-full text-center text-2xl font-black py-2 bg-slate-50 border rounded-xl text-slate-900">
      </div>
      <div class="space-y-2 pt-2">
        <button onclick="executeSubmit(true)" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm rounded-xl">
          作業時間を上書きして送信
        </button>
        <button onclick="executeSubmit(false)" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold text-xs rounded-xl">
          作業時間をスキップして実績のみ送信
        </button>
        <button onclick="closeSubmitModal()" class="w-full py-1.5 text-slate-400 text-xs">キャンセル</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_MASTER = [
      { code: 'RMB-001', name1: 'ROMBO', name2: 'BLK WHT XS', size: 'XS', jan: '4580001230011' },
      { code: 'RMB-002', name1: 'ROMBO', name2: 'BLK WHT S', size: 'S', jan: '4580001230028' },
      { code: 'RMB-003', name1: 'ROMBO', name2: 'NVY RED M', size: 'M', jan: '4580001230035' }
    ];
    let masterItems = DEFAULT_MASTER;
    let draftRecords = [];
    let activeScannedItem = null;
    let isAwaitingQuantity = false;
    let html5QrScanner = null;
    let isCameraActive = false;
    let selectedCameraId = '';
    let isProdUnlocked = false;

    function isGasNativeEnv() {
      return typeof google !== 'undefined' && google.script && google.script.run;
    }

    function getEffectiveGasUrl() {
      const inputEl = document.getElementById('gasUrlInput');
      const inputVal = inputEl ? inputEl.value.trim() : '';
      const saved = localStorage.getItem('gas_insp_url') || '';
      if (inputVal) return inputVal;
      if (saved) return saved;
      return '';
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadStorage();
      setupSearchEvents();
      updateDraftUI();
      refreshMaster();
    });

    function loadStorage() {
      try {
        const m = localStorage.getItem('gas_insp_master');
        if (m) {
          const parsed = JSON.parse(m);
          if (Array.isArray(parsed) && parsed.length > 0) {
            masterItems = parsed;
          }
        }
      } catch (e) {
        masterItems = DEFAULT_MASTER;
      }

      if (!masterItems || masterItems.length === 0) {
        masterItems = DEFAULT_MASTER;
      }

      document.getElementById('headerMasterCount').textContent = `マスタ: ${masterItems.length}件`;
      
      try {
        const d = localStorage.getItem('gas_insp_drafts');
        draftRecords = d ? JSON.parse(d) : [];
      } catch { draftRecords = []; }

      const w = localStorage.getItem('gas_insp_worker') || '山田';
      document.getElementById('workerInput').value = w;
      document.getElementById('headerWorkerName').textContent = w;

      const savedUrl = localStorage.getItem('gas_insp_url') || '';
      if (savedUrl) {
        document.getElementById('gasUrlInput').value = savedUrl;
      }
    }

    function refreshMaster() {
      const effectiveUrl = getEffectiveGasUrl();
      if (isGasNativeEnv()) {
        google.script.run
          .withSuccessHandler(data => {
            if (data && data.success && Array.isArray(data.items) && data.items.length > 0) {
              masterItems = data.items;
              localStorage.setItem('gas_insp_master', JSON.stringify(data.items));
              document.getElementById('headerMasterCount').textContent = `マスタ: ${masterItems.length}件`;
            }
          })
          .withFailureHandler(() => {})
          .getMaster();
      } else if (effectiveUrl) {
        fetch(effectiveUrl + '?action=getMaster')
          .then(res => res.json())
          .then(data => {
            if (data && data.success && Array.isArray(data.items) && data.items.length > 0) {
              masterItems = data.items;
              localStorage.setItem('gas_insp_master', JSON.stringify(data.items));
              document.getElementById('headerMasterCount').textContent = `マスタ: ${masterItems.length}件`;
            }
          }).catch(() => {});
      }
    }

    function saveDrafts() {
      localStorage.setItem('gas_insp_drafts', JSON.stringify(draftRecords));
      updateDraftUI();
    }

    function showToast(msg) {
      const el = document.getElementById('toastNotification');
      document.getElementById('toastMessage').textContent = msg;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 2500);
    }

    function getJstDateString() {
      const parts = new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
      return `${(parts.find(p=>p.type==='year')||{}).value}-${(parts.find(p=>p.type==='month')||{}).value}-${(parts.find(p=>p.type==='day')||{}).value}`;
    }

    function updateDraftUI() {
      const count = draftRecords.length;
      const totalQty = draftRecords.reduce((sum, r) => sum + r.quantity, 0);
      document.getElementById('listTotalKindsBadge').textContent = `${count}品目`;
      document.getElementById('listTotalQuantityBadge').textContent = `${totalQty.toLocaleString()} 個`;
      document.getElementById('btnOpenSubmitModal').disabled = count === 0;

      const container = document.getElementById('draftListContainer');
      if (count === 0) {
        container.innerHTML = '<div class="h-full flex items-center justify-center text-slate-400 text-xs font-bold">未送信の検品実績はありません</div>';
        return;
      }
      container.innerHTML = draftRecords.map(item => `
        <div class="p-3 bg-slate-50 rounded-xl border flex items-center justify-between">
          <div>
            <div class="text-xs font-bold text-indigo-700">${item.code} - ${item.name1}</div>
            <div class="text-xs font-bold text-amber-900">${item.name2} / ${item.size}</div>
          </div>
          <div class="text-sm font-black text-slate-900">${item.quantity} 個</div>
        </div>
      `).join('');
    }

    function openSubmitModal() {
      document.getElementById('modalWorkerInput').value = document.getElementById('workerInput').value;
      document.getElementById('modalInspectionDateInput').value = getJstDateString();
      document.getElementById('modalSubmit').classList.remove('hidden');
    }

    function closeSubmitModal() {
      document.getElementById('modalSubmit').classList.add('hidden');
    }

    function setActiveScannedItem(item) {
      activeScannedItem = item;
      isAwaitingQuantity = true;

      document.getElementById('activeItemCode').textContent = item.code || '';
      document.getElementById('activeItemName1').textContent = item.name1 || '';
      document.getElementById('activeItemName2').textContent = `${item.name2 || ''} · ${item.size || ''}`;
      document.getElementById('activeItemSize').textContent = item.size || '';
      document.getElementById('activeItemJan').textContent = item.jan || '-';

      const qtyInput = document.getElementById('tenkeyQtyInput');
      qtyInput.value = 1;

      document.getElementById('cockpitIdleState').classList.add('hidden');
      document.getElementById('cockpitActiveState').classList.remove('hidden');

      setTimeout(() => {
        qtyInput.focus();
        qtyInput.select();
      }, 50);
    }

    function cancelActiveScan() {
      activeScannedItem = null;
      isAwaitingQuantity = false;
      document.getElementById('cockpitActiveState').classList.add('hidden');
      document.getElementById('cockpitIdleState').classList.remove('hidden');
    }

    function adjustTenkeyQty(delta) {
      const input = document.getElementById('tenkeyQtyInput');
      let val = (parseInt(input.value, 10) || 1) + delta;
      if (val < 1) val = 1;
      input.value = val;
    }

    function setTenkeyQty(val) {
      document.getElementById('tenkeyQtyInput').value = val;
    }

    function handleTenkeyKeyDown(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        confirmActiveItem();
      } else if (e.key === 'Escape') {
        cancelActiveScan();
      }
    }

    function confirmActiveItem() {
      if (!activeScannedItem) return;
      const input = document.getElementById('tenkeyQtyInput');
      const qty = Math.max(1, parseInt(input.value, 10) || 1);
      const worker = document.getElementById('workerInput').value.trim() || '山田';
      const today = getJstDateString();

      const existingIdx = draftRecords.findIndex(r => String(r.code) === String(activeScannedItem.code));
      if (existingIdx >= 0) {
        draftRecords[existingIdx].quantity += qty;
      } else {
        draftRecords.unshift({
          id: 'draft_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
          date: today,
          worker: worker,
          code: activeScannedItem.code,
          name1: activeScannedItem.name1,
          name2: activeScannedItem.name2,
          size: activeScannedItem.size,
          jan: activeScannedItem.jan || '',
          quantity: qty
        });
      }

      saveDrafts();
      showToast(`${activeScannedItem.name1} (${qty}個) を追加しました`);
      cancelActiveScan();
    }

    function executeSubmit(includeTime) {
      const worker = document.getElementById('modalWorkerInput').value.trim() || '山田';
      const mins = includeTime ? (parseInt(document.getElementById('workMinutesInput').value, 10) || 0) : 0;
      const selectedDate = document.getElementById('modalInspectionDateInput').value || getJstDateString();

      const recordsToSubmit = draftRecords.map(d => ({ ...d, date: selectedDate, worker: worker }));
      const workTimeRecord = includeTime ? { date: selectedDate, worker: worker, minutes: mins } : null;

      const payload = {
        action: 'submitReport',
        records: recordsToSubmit,
        workTime: workTimeRecord
      };

      const url = getEffectiveGasUrl();
      
      if (isGasNativeEnv()) {
        google.script.run
          .withSuccessHandler(() => { finishSubmitSuccess(); })
          .withFailureHandler(() => { finishSubmitSuccess(); })
          .doPostSimulation(payload);
      } else if (url) {
        fetch(url, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) }).catch(() => {});
      }

      finishSubmitSuccess();
    }

    function finishSubmitSuccess() {
      draftRecords = [];
      saveDrafts();
      closeSubmitModal();
      showToast('データを送信しました（作業時間は上書きされます）');
    }

    function setupSearchEvents() {
      const searchInput = document.getElementById('searchInput');
      const suggestBox = document.getElementById('suggestBox');
      if (!searchInput || !suggestBox) return;

      searchInput.addEventListener('input', (e) => {
        const val = e.target.value.trim().toLowerCase();
        if (val.length > 0) {
          const filtered = masterItems.filter(item => {
            const combined = `${item.code} ${item.name1} ${item.name2} ${item.size} ${item.jan}`.toLowerCase();
            return val.split(/\s+/).every(t => combined.includes(t));
          }).slice(0, 15);
          
          if (filtered.length > 0) {
            suggestBox.innerHTML = `
              <div class="px-3 py-1.5 bg-slate-50 text-[11px] text-slate-500 font-bold sticky top-0 border-b flex justify-between">
                <span>検索候補: ${filtered.length}件</span>
                <span class="text-indigo-600">クリックで数量入力へ</span>
              </div>
            ` + filtered.map(item => `
              <div class="search-item-row p-3 hover:bg-indigo-50/80 transition flex items-center justify-between gap-2 border-b border-slate-100 cursor-pointer" data-code="${escapeHtml(String(item.code))}">
                <div class="pr-2 flex-1 min-w-0 pointer-events-none">
                  <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-indigo-700 font-mono bg-indigo-50 px-2 py-0.5 rounded">${escapeHtml(item.code)}</span>
                    <span class="text-sm font-bold text-slate-900 truncate">${escapeHtml(item.name1)}</span>
                  </div>
                  <div class="text-xs text-amber-900 mt-1 font-semibold">${escapeHtml(item.name2)} / <span class="text-indigo-900 font-bold">${escapeHtml(item.size)}</span></div>
                </div>
                <button type="button" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl shadow-2xs flex-shrink-0 pointer-events-none">
                  選択 ➜
                </button>
              </div>
            `).join('');
            suggestBox.classList.remove('hidden');
          } else {
            suggestBox.innerHTML = '<div class="p-4 text-center text-xs font-bold text-rose-600 bg-rose-50">⚠️ 一致する商品が見つかりません</div>';
            suggestBox.classList.remove('hidden');
          }
        } else {
          suggestBox.classList.add('hidden');
        }
      });

      // イベント委任（Event Delegation）を用いてクリックを確実に検知・処理する
      suggestBox.addEventListener('click', (e) => {
        const row = e.target.closest('.search-item-row');
        if (!row) return;
        const code = row.getAttribute('data-code');
        if (code) {
          selectSearchItem(code);
        }
      });
    }

    function selectSearchItem(code) {
      const item = masterItems.find(m => String(m.code) === String(code));
      if (item) {
        document.getElementById('searchInput').value = '';
        document.getElementById('suggestBox').classList.add('hidden');
        setActiveScannedItem(item);
      } else {
        console.warn('商品コードがマスターに見つかりません:', code);
      }
    }

    function switchTab(tab) {
      document.getElementById('tab-workstation').classList.add('hidden');
      document.getElementById('tab-productivity').classList.add('hidden');
      document.getElementById('tab-settings').classList.add('hidden');
      if (tab === 'workstation') document.getElementById('tab-workstation').classList.remove('hidden');
      if (tab === 'productivity') document.getElementById('tab-productivity').classList.remove('hidden');
      if (tab === 'settings') document.getElementById('tab-settings').classList.remove('hidden');
    }

    function unlockProductivity() {
      if (document.getElementById('prodPinInput').value.trim() === '0120') {
        isProdUnlocked = true;
        document.getElementById('prodLockScreen').classList.add('hidden');
        document.getElementById('prodDashboardContent').classList.remove('hidden');
      } else {
        alert('PINが違います');
      }
    }

    function saveGasUrl() {
      localStorage.setItem('gas_insp_url', document.getElementById('gasUrlInput').value.trim());
      showToast('URLを保存しました');
      refreshMaster();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
